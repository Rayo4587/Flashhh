<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ATC brand video</title>
<style>
  @font-face { font-family: 'RocBlackObl'; src: url('/video/build/fonts/Rocinante-BlackOblique.otf'); }
  @font-face { font-family: 'RocBlack'; src: url('/video/build/fonts/Rocinante-Black.otf'); }
  @font-face { font-family: 'RocLightObl'; src: url('/video/build/fonts/Rocinante-LightOblique.otf'); }
  @font-face { font-family: 'RocMedObl'; src: url('/video/build/fonts/Rocinante-MediumOblique.otf'); }
  @font-face { font-family: 'BioBold'; src: url('/brand/fonts/BioSans-BoldItalic.otf'); }
  @font-face { font-family: 'BioIt'; src: url('/brand/fonts/BioSans-Italic.otf'); }
  @font-face { font-family: 'BioLight'; src: url('/brand/fonts/BioSans-ExtraLightItalic.otf'); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  canvas { display: block; }
  .hud { position: absolute; color: #f2f2f2; font-family: 'BioIt'; font-size: 26px; letter-spacing: 0.08em;
         text-transform: uppercase; line-height: 1.25; opacity: 0.9; }
  .hud b { font-family: 'BioBold'; font-weight: normal; }
  #tl { top: 64px; left: 64px; }
  #tr { top: 64px; right: 64px; text-align: right; }
  #bl { bottom: 64px; left: 64px; }
  #br { bottom: 64px; right: 64px; text-align: right; }
  .tick { position: absolute; width: 34px; height: 34px; border-color: #f2f2f2; border-style: solid; opacity: 0.6; }
  #k1 { top: 36px; left: 36px; border-width: 3px 0 0 3px; }
  #k2 { top: 36px; right: 36px; border-width: 3px 3px 0 0; }
  #k3 { bottom: 36px; left: 36px; border-width: 0 0 3px 3px; }
  #k4 { bottom: 36px; right: 36px; border-width: 0 3px 3px 0; }
  #cap { position: absolute; left: 90px; right: 90px; bottom: 330px; text-align: center; color: #fff;
         font-family: 'BioBold'; font-size: 58px; line-height: 1.12; letter-spacing: 0.01em;
         text-shadow: 0 4px 30px rgba(0,0,0,0.85); }
  #cap span { display: inline-block; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/video/node_modules/three/build/three.module.js",
  "three/addons/": "/video/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="flash"></div>
  <div class="tick" id="k1"></div><div class="tick" id="k2"></div>
  <div class="tick" id="k3"></div><div class="tick" id="k4"></div>
  <div class="hud" id="tl"><b>AT THE CLUB</b><br>WELLNESS GLOBAL COMMUNITY</div>
  <div class="hud" id="tr"><b id="city">MEDELLÍN</b><br><span id="coords">06.25°N 75.57°W</span></div>
  <div class="hud" id="bl"><b id="idx">001</b> / <span id="disc">MOVE</span></div>
  <div class="hud" id="br">SINCE 2025<br><b>@WELLNESSATTHECLUB</b></div>
  <div id="cap"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
